mappings:
  - tag: peso_actual
    enabled: true
    aas:
      submodel: Operativos
      collection: Pesada
      property: peso
    data:
      value_type: xs:float
      unit: kg
      default: 0.0
    semantics:
      description: Peso actual medido en la estación de pesada
      class: runtime

  - tag: cantidad_pesadas
    enabled: true
    aas:
      submodel: Operativos
      collection: Pesada
      property: cantidadPesadas
    data:
      value_type: xs:int
      unit: count
      default: 0
    semantics:
      description: Cantidad acumulada de pesadas realizadas
      class: runtime

  - tag: estado_pesada
    enabled: true
    aas:
      submodel: Operativos
      collection: Pesada
      property: estado
    data:
      value_type: xs:boolean
      unit: null
      default: false
    semantics:
      description: Estado actual del proceso de pesada
      class: runtime

  - tag: tiempo_ciclo_actual
    enabled: true
    aas:
      submodel: Operativos
      collection: Produccion
      property: tiempoCicloActual
    data:
      value_type: xs:float
      unit: s
      default: 0.0
    semantics:
      description: Tiempo actual de ciclo de producción
      class: runtime

  - tag: consumo_electrico
    enabled: true
    aas:
      submodel: Operativos
      collection: Produccion
      property: consumoElectrico
    data:
      value_type: xs:float
      unit: kWh
      default: 0.0
    semantics:
      description: Consumo eléctrico asociado a la operación actual
      class: runtime

  - tag: cantidad_llenadas
    enabled: true
    aas:
      submodel: Operativos
      collection: Produccion
      property: cantidadLlenadas
    data:
      value_type: xs:int
      unit: count
      default: 0
    semantics:
      description: Cantidad acumulada de ciclos de llenado
      class: runtime

  - tag: parada_emergencia
    enabled: true
    aas:
      submodel: Alarmas
      property: paradaEmergencia
    data:
      value_type: xs:boolean
      unit: null
      default: false
    semantics:
      description: Indica si la parada de emergencia se encuentra activa
      class: alarm