services:
  app:
    build: .
    image: proyecto-embolsadora:dev
    container_name: aas_historian_middleware
    restart: unless-stopped
    working_dir: /app
    command: python3 -m src.historian.main
    environment:
      - PYTHONUNBUFFERED=1
      - MODBUS_HOST=mock
      - MODBUS_PORT=502
      - POLL_INTERVAL=1
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=org
      - INFLUX_BUCKET=bucket
      - AAS_XML_PATH=/app/Embolsadora_V3.xml
      - AAS_MAPPING_PATH=/app/src/historian/aas_mapping.yaml
      - AAS_OUTPUT_PATH=/app/runtime/Embolsadora_runtime.xml
      - BASYX_URL=http://basyx:8081
    volumes:
      - ./src/historian/tags.yaml:/app/src/historian/tags.yaml:ro
      - ./src/historian/tags.yaml:/app/src/historian/tags.yaml:ro
      - ./src/historian/aas_mapping.yaml:/app/src/historian/aas_mapping.yaml:ro
      - ./Embolsadora_V3.xml:/app/Embolsadora_V3.xml:ro
      - ./runtime:/app/runtime
    depends_on:
      - influxdb
    networks:
      - pe_net

  #plc:
  #  image: ghcr.io/agustin-aicardi/proyecto-embolsadora:latest
  #  container_name: modbus_plc_sim
  #  restart: unless-stopped
  #  working_dir: /app
  #  command: python3 -m src.historian.mock_modbus
  #  networks:
  #    - pe_net

  influxdb:
    image: influxdb:2.6
    container_name: proyecto-embolsadora-influxdb-1
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=org
      - DOCKER_INFLUXDB_INIT_BUCKET=bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - pe_net

  # faaast:
  #   image: fraunhoferiosb/faaast-service:latest
  #   container_name: faaast_service
  #   ports:
  #     - "8081:8081"
  #   volumes:
  #     - ./faaast/config.json:/app/config/config.json:ro
  #     - ./:/app/model
  #     - ./faaast/data:/app/faaast-data
  #   command: ["-c", "/app/config/config.json"]
  #   depends_on:
  #     - app
  #   networks:
  #     - pe_net

  basyx:
    image: eclipsebasyx/aas-environment:2.0.0-SNAPSHOT
    container_name: basyx_aas_environment
    ports:
      - "8081:8081"
    volumes:
      - ./runtime:/app/runtime:ro
      - ./basyx/application.properties:/application/application.properties:ro
    depends_on:
      - app
    networks:
      - pe_net

  basyx-ui:
    image: eclipsebasyx/aas-gui:latest
    container_name: basyx-ui
    ports:
      - "3000:3000"
    environment:
      AAS_SERVER_URL: http://basyx:8081
    depends_on:
      - basyx
    networks:
      - pe_net

networks:
  pe_net:
    driver: bridge

volumes:
  influxdb_data: